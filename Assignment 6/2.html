<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Element Access Example</title>
</head>

<body>

    <div id="myElement">Hello, World!</div>
    <div class="myClass">Item 1</div>
    <div class="myClass">Item 2</div>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        output.innerHTML = `
            ID: ${document.getElementById('myElement').innerText} <br>
            Class (1st): ${document.getElementsByClassName('myClass')[0].innerText} <br>
            Tag (2nd Paragraph): ${document.getElementsByTagName('p')[1].innerText} <br>
            Selector (1st Class): ${document.querySelector('.myClass').innerText} <br>
            All Classes: ${[...document.querySelectorAll('.myClass')].map(el => el.innerText).join(', ')}
        `;
    </script>

</body>

</html>
