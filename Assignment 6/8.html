<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Propagation Example</title>
    <style>
        .outer {
            padding: 20px;
            background-color: lightblue;
        }

        .inner {
            padding: 20px;
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <div class="outer" id="outerDiv">
        Outer Div
        <div class="inner" id="innerDiv">
            Inner Div
        </div>
    </div>

    <script>
        // Event listener for outer div (bubbling phase)
        document.getElementById('outerDiv').addEventListener('click', function () {
            alert('Outer Div Clicked!');
        });

        // Event listener for inner div (bubbling phase)
        document.getElementById('innerDiv').addEventListener('click', function (event) {
            alert('Inner Div Clicked!');
            // Uncomment the next line to stop propagation
            // event.stopPropagation();
        }, false); // Capture phase (if true)

    </script>

</body>

</html>
